apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.96.1
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: monitoring
      interval: 6h
  # CRDs kommen aus infrastructure/crd/monitoring (victoria-metrics-operator-crds)
  install:
    crds: Skip
  upgrade:
    crds: Skip
  valuesFrom:
    - kind: ConfigMap
      name: victoria-metrics-k8s-stack-helm-values
