---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 24h
  values:
    controllers:
      main:
        pod:
          securityContext: # rootless, siehe paperless docs "Rootless"; passt zum VolSync-Mover (1000)
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.2.1
            env:
              PAPERLESS_URL: https://paperless-ngx.beehive.lan64.de
              PAPERLESS_TIME_ZONE: Europe/Berlin
              PAPERLESS_OCR_LANGUAGE: deu
              # app-template rendert env per tpl, daher als Raw-String maskiert
              PAPERLESS_FILENAME_FORMAT: "{{`{{ created_year }}/{{ created_month }}/{{ correspondent }}/{{ title }}`}}"
              PAPERLESS_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx
                    key: PAPERLESS_SECRET_KEY
            # wie der HEALTHCHECK im paperless-Image; Host localhost ist in ALLOWED_HOSTS immer erlaubt
            probes:
              # erster Start inkl. DB-Migrationen kann dauern (bis 10 min)
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &paperlessngxHttp
                    path: /accounts/login/
                    port: 8000
                    httpHeaders:
                      - name: Host
                        value: localhost
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              # großzügige Timeouts: die Login-Seite kann während OCR langsam sein
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *paperlessngxHttp
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *paperlessngxHttp
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 4Gi
              limits:
                memory: 4Gi

          valkey:
            image:
              repository: docker.io/valkey/valkey
              tag: 9.1.2-alpine
            probes:
              readiness: &valkeyProbe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
              liveness: *valkeyProbe
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 100Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]

    service:
      app:
        controller: main
        ports:
          http:
            port: 8000

    ingress:
      app:
        className: traefik
        hosts:
          - host: paperless-ngx.beehive.lan64.de
            paths:
              - path: /
                service:
                  identifier: app
                  port: http

    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        dataSourceRef:
          kind: ReplicationDestination
          apiGroup: volsync.backube
          name: paperless-ngx-data
        advancedMounts:
          main:
            app:
              - path: /usr/src/paperless/data

      media:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        dataSourceRef:
          kind: ReplicationDestination
          apiGroup: volsync.backube
          name: paperless-ngx-media
        advancedMounts:
          main:
            app:
              - path: /usr/src/paperless/media

      consume:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          main:
            app:
              - path: /usr/src/paperless/consume

      backup:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          main:
            app:
              - path: /backup

      valkey:
        type: emptyDir
        advancedMounts:
          main:
            valkey:
              - path: /data
