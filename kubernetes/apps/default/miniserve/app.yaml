---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miniserve
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 24h
  values:
    controllers:
      main:
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: svenstaro/miniserve
              tag: 0.35.0-alpine
            args:
              - /data
              - --upload-files
              - --mkdir
              - --rm-files
              - --qrcode
              - --on-duplicate-files
              - rename
              - --port
              - "8080"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 100Mi

    service:
      app:
        controller: main
        ports:
          http:
            port: 8080

    ingress:
      app:
        className: traefik
        hosts:
          - host: miniserve.beehive.lan64.de
            paths:
              - path: /
                service:
                  identifier: app
                  port: http

    persistence:
      nas:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /data/nas

      paperless-ngx-backup:
        existingClaim: paperless-ngx-backup
        globalMounts:
          - path: /data/paperless-ngx/backup

      paperless-ngx-consume:
        existingClaim: paperless-ngx-consume
        globalMounts:
          - path: /data/paperless-ngx/consume
