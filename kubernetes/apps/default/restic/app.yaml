---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 24h
  values:
    controllers:
      backrest:
        replicas: 1
        containers:
          backrest:
            image:
              repository: ghcr.io/garethgeorge/backrest
              tag: v1.14.1
            env:
              BACKREST_DATA: /data
              BACKREST_CONFIG: /config/config.json
              XDG_CACHE_HOME: /cache
              BACKREST_PORT: 0.0.0.0:9898
              TZ: Europe/Berlin
            probes:
              liveness: &probe
                # enabled: true
                # custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9898
                  # initialDelaySeconds: 30
                  # periodSeconds: 30
              readiness: *probe
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              privileged: false
              capabilities:
                drop:
                  - ALL

    service:
      backrest:
        controller: backrest
        ports:
          http:
            port: 9898

    ingress:
      backrest:
        className: traefik
        hosts:
          - host: backrest.beehive.lan64.de
            paths:
              - path: /
                service:
                  identifier: backrest
                  port: http

    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /config
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /data
      cache:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /cache
      repo:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: /repo
      filen:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: /filen
      rclone:
        type: secret
        name: backrest-secrets
        globalMounts:
          - path: /root/.config/rclone/rclone.conf
            subPath: rclone.conf
            readOnly: true
