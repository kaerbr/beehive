apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: rawfile-localpv
  namespace: openebs
spec:
  url: https://openebs.github.io/rawfile-localpv
  interval: 6h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rawfile-localpv
  namespace: openebs
spec:
  interval: 30m
  chart:
    spec:
      chart: rawfile-localpv
      version: 0.15.3
      sourceRef:
        kind: HelmRepository
        name: rawfile-localpv
        namespace: openebs
      interval: 6h
  valuesFrom:
    - kind: ConfigMap
      name: rawfile-localpv-helm-values
